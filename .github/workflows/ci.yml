name: SDK checks
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e './sdks/python[dev]' build
      - run: python scripts/sync_protocol.py --check
      - run: ruff check .
      - run: python -m pytest
      - run: python -m build sdks/python --outdir output/python-dist
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -e './sdks/python[dev,desktop]'
      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
  javascript:
    runs-on: ubuntu-latest
    env:
      DUCKAI_TEST_BROWSER: "1"
    strategy:
      fail-fast: false
      matrix:
        runtime: [node22, node24, bun, deno]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.runtime == 'node24' && '24' || '22' }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm exec --workspace @rendertk/duckai-sdk -- playwright install --with-deps chromium --no-shell
      - run: npm run build && npm run check
      - run: npm test
        if: startsWith(matrix.runtime, 'node')
      - run: bun test sdks/typescript/test/*.test.ts
        if: matrix.runtime == 'bun'
      - run: deno test -A --node-modules-dir=manual sdks/typescript/test/*.test.ts
        if: matrix.runtime == 'deno'
      - run: mkdir -p output && npm pack --workspace @rendertk/duckai-sdk --pack-destination ./output
  csharp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test sdks/csharp/DuckAI.Tests/DuckAI.Tests.csproj -c Release
      - run: dotnet pack sdks/csharp/DuckAI/DuckAI.csproj -c Release -o output/nuget
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path sdks/swift
      - run: xcodebuild -project sdks/swift/Examples/DuckAIExample.xcodeproj -scheme DuckAIExample -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
      - run: xcodebuild -project sdks/swift/Examples/DuckAIExample.xcodeproj -scheme DuckAIMacExample -destination 'platform=macOS' build CODE_SIGNING_ALLOWED=NO
  flutter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
        working-directory: sdks/dart
      - run: flutter analyze && flutter test
        working-directory: sdks/dart
      - run: flutter config --jdk-dir "$JAVA_HOME"
        if: runner.os == 'Linux'
      - run: flutter build apk --debug
        if: runner.os == 'Linux'
        working-directory: sdks/dart/example
      - run: flutter build ios --simulator --debug --config-only && cd ios && xcodebuild -workspace Runner.xcworkspace -scheme Runner -sdk iphonesimulator -configuration Debug ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
        if: runner.os == 'macOS'
        working-directory: sdks/dart/example
        env:
          FLUTTER_SWIFT_PACKAGE_MANAGER: "true"
