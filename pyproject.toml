[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "duckai-sdk"
version = "0.2.0"
description = "Direct Python SDK for Duck.ai with automatic anonymous sessions, streaming, and attachments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "playwright>=1.50,<2",
  "pillow>=11,<13",
  "pypdf>=5,<7",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.7,<3",
]

[project.urls]
Repository = "https://github.com/RenderTk/duckai_sdk"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["duckai*"]

[tool.setuptools.package-data]
duckai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
